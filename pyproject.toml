[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geocore-diffusers"
version = "0.1.0"
description = "Diffusers-style GeoCore-9B inference components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "diffusers>=0.32",
    "transformers",
    "einops",
]

[tool.setuptools]
package-dir = {"geocore_diffusers" = "src/diffusers"}
packages = [
    "geocore_diffusers",
    "geocore_diffusers.models",
    "geocore_diffusers.models.transformers",
    "geocore_diffusers.pipelines",
    "geocore_diffusers.pipelines.geocore",
    "geocore_diffusers.schedulers",
]
